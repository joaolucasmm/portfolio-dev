version: 2
# Updates go into Development, like every other change, and reach main with the
# next publication. Dependabot reads this file from the default branch (main), so
# a change here takes effect once it is published.
updates:
  # npm updates arrive grouped in one weekly PR; security fixes still come on their own.
  - package-ecosystem: npm
    directory: /
    target-branch: Development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: Development
    schedule:
      interval: monthly
