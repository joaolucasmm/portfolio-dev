name: build-test-deploy

on:
  # Deploy branches on push; every other branch is checked through its pull request,
  # so a PR branch does not run twice.
  push:
    branches: [main, Development]
  pull_request:
  # Weekly, so dead links and new vulnerabilities show up even without pushes.
  schedule:
    - cron: "0 9 * * 1"
  # Run by hand from the Actions tab, e.g. to deploy Development again without a commit.
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build
      - name: bundle size
        run: npm run size
      - name: keep the build for the browser checks
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 3

  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - run: npm test -- --coverage

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build/
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: browser tests, computer and phone
        run: npm run e2e
      - name: report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build/
      # Accessibility, best practices and SEO fail the job under 90; performance only warns,
      # since CI machines vary too much for a hard limit.
      - name: lighthouse
        run: npx --yes @lhci/cli@0.14.0 autorun

  links:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: check the links on the page
        uses: lycheeverse/lychee-action@v2
        with:
          # What visitors see. Sites that turn bots away (403, 429) count as up.
          args: --no-progress --max-retries 3 --accept 200..=299,403,429 src/content.js index.html
          fail: true

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      # Fails on critical advisories only; lower ones are left to Dependabot.
      - name: npm audit (critical)
        run: npm audit --omit=dev --audit-level=critical

  deploy-dev:
    needs: [build, test, e2e]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/Development'

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: Development
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - name: configure github pages
        uses: actions/configure-pages@v4
      - run: npm ci
      - run: npm run build
        env:
          REACT_APP_SERVICE_ID: ${{ secrets.REACT_APP_SERVICE_ID }}
          REACT_APP_TEMPLATE_ID: ${{ secrets.REACT_APP_TEMPLATE_ID }}
          REACT_APP_PUBLIC_KEY: ${{ secrets.REACT_APP_PUBLIC_KEY }}
      - name: upload artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build/'
          # One name per attempt: artifacts from earlier attempts stay in the run, and
          # deploy-pages fails if more than one artifact has the name it looks for.
          name: github-pages-${{ github.run_attempt }}
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  git-push:
    needs: [build, test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write
      pages: write
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: configure git safe directory
        run: git config --global --add safe.directory /github/workspace
      - name: clone destination repo
        run: git clone https://joaolucasmm:${{ secrets.PROD_TOKEN }}@github.com/joaolucasmm/portfolio.git /tmp/portfolio
      - name: copy files
        run: |
          rsync -av --exclude='.git' ./ /tmp/portfolio/
          cd /tmp/portfolio
          git config --global user.email "joaol_mm@hotmail.com"
          git config --global user.name "joaolucasmm"
          git add .
          # Production keeps its own workflow. package.json and the lockfile go
          # across, so it builds with the same tools; vite.config.mjs takes the
          # /portfolio/ path from the repository name.
          git restore --staged ./.github/workflows/build-test-deploy.yml
      - name: commit changes if any
        run: |
          cd /tmp/portfolio
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update from CI"
          fi
      - name: verify source repository state
        run: |
          git log --oneline
      - name: fetch latest changes from portfolio-dev
        run: |
          git fetch --all
      - name: cherry-pick commits from source repo
        run: |
          git fetch --all
          git log --pretty=format:"%H" origin/main..HEAD > /tmp/commits.txt
          cat /tmp/commits.txt
          cd /tmp/portfolio
          while IFS= read -r commit_hash; do
            if ! git cherry-pick "$commit_hash"; then
              # Usually empty because rsync already copied it; a conflict shows up as a warning on the run.
              echo "::warning title=Commit skipped::cherry-pick of $commit_hash did not apply and was skipped"
              git cherry-pick --skip
            fi
          done < /tmp/commits.txt
      - name: verify destination repository state
        run: |
          cd /tmp/portfolio
          git log --oneline
      - name: push to another repository
        run: |
          cd /tmp/portfolio
          git push origin main
